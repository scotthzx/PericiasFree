<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perícias Free - PCERJ</title>

    <!-- BIBLIOTECA DE ÍCONES FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #c9a227;
            --bg: #0f1115;
            --card-bg: #1c1f26;
            --text: #e0e0e0;
            --text-muted: #8b8f96;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* CABEÇALHO */
        header {
            background-color: #16181d;
            border-bottom: 2px solid var(--primary);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area img {
            height: 60px;
            border-radius: 50%;
        }

        .logo-area h1 {
            color: var(--primary);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-area span {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            text-transform: none;
            letter-spacing: 1px;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ABAS (TABS) */
        .tabs {
            display: flex;
            background-color: #16181d;
            padding: 0 20px;
            overflow-x: auto;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 15px 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn i {
            font-size: 16px;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background-color: rgba(201, 162, 39, 0.05);
        }

        /* CONTAINER PRINCIPAL */
        main {
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* GALERIA DE CARDS */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2a2e38;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border-color: #3a3f4b;
        }

        .card-img-container {
            position: relative;
            height: 200px;
            overflow: hidden;
            background-color: #000;
            display: flex;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: 0.3s;
        }

        .card-img-container img:hover {
            transform: scale(1.05);
        }

        .tag-tipo {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.8);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid var(--primary);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Tag indicando que tem mais imagens */
        .tag-mais-fotos {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(201, 162, 39, 0.9);
            color: #000;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-delete-card {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            background-color: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .btn-delete-card:hover {
            background-color: var(--danger);
            transform: scale(1.1);
        }

        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .card-info h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 5px;
        }

        .dados-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .dados-grid span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dados-grid span b {
            color: #ccc;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #2a2e38;
        }

        button.action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-ver {
            background-color: #34495e;
            color: white;
        }

        .btn-ver:hover {
            background-color: #4a6278;
        }

        .btn-periciar {
            background-color: var(--primary);
            color: #000;
        }

        .btn-periciar:hover {
            background-color: #e0b834;
        }

        /* ESTADO DE PERÍCIA CONCLUÍDA */
        .card.periciado {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .card.periciado .btn-group {
            display: none;
        }

        .card.periciado .status-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            background-color: rgba(231, 76, 60, 0.2);
            color: var(--danger);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-top: auto;
            border: 1px solid var(--danger);
        }

        .status-badge {
            display: none;
        }

        /* MODAIS (Admin e Detalhes) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            width: 95%;
            max-width: 700px;
            border: 1px solid var(--primary);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Estilos específicos do Modal de Detalhes */
        .detalhes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .detalhes-header h2 {
            margin: 0;
            text-align: left;
        }

        .btn-fechar {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-fechar:hover {
            color: var(--danger);
            transform: scale(1.1);
        }

        .detalhes-info {
            background-color: #16181d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .detalhes-info p {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detalhes-info p i {
            color: var(--primary);
            width: 16px;
            text-align: center;
        }

        .detalhes-info b {
            color: var(--primary);
        }

        .galeria-detalhes {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .img-detalhe-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .img-detalhe-wrapper img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .btn-copiar-img {
            background-color: #2c3e50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-copiar-img:hover {
            background-color: #34495e;
        }

        /* Formulário Admin */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #3a3f4b;
            background-color: #16181d;
            color: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-cancel {
            background-color: #3a3f4b;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #4a4f5b;
        }

        .btn-save {
            background-color: var(--primary);
            color: black;
        }

        .btn-save:hover {
            background-color: #e0b834;
        }

        .loading,
        .vazio {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 18px;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-area">
            <img src="https://i.imgur.com/C658rVx.png" alt="Logo PCERJ">
            <div>
                <h1>Perícias Free</h1>
                <span>Polícia Civil do Estado do Rio de Janeiro</span>
            </div>
        </div>
        <button class="admin-btn" onclick="abrirAdmin()">
            <i class="fa-solid fa-plus"></i> Cadastrar Perícia
        </button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-tipo="Caminhao" onclick="mudarAba('Caminhao', this)">
            <i class="fa-solid fa-truck"></i> Caminhão
        </button>
        <button class="tab-btn" data-tipo="Veiculo" onclick="mudarAba('Veiculo', this)">
            <i class="fa-solid fa-car"></i> Veículo
        </button>
        <button class="tab-btn" data-tipo="Corpo" onclick="mudarAba('Corpo', this)">
            <i class="fa-solid fa-user-injured"></i> Corpo
        </button>
        <button class="tab-btn" data-tipo="FAC/ORG" onclick="mudarAba('FAC/ORG', this)">
            <i class="fa-solid fa-skull"></i> FAC/ORG
        </button>
    </div>

    <main>
        <div class="galeria" id="galeria">
            <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Carregando perícias...</div>
        </div>
    </main>

    <!-- MODAL DE DETALHES DA PERÍCIA -->
    <div class="modal-overlay" id="modalDetalhes">
        <div class="modal-content">
            <div class="detalhes-header">
                <h2><i class="fa-solid fa-file-magnifying-glass" style="color: var(--primary);"></i> Detalhes da Perícia
                </h2>
                <button class="btn-fechar" onclick="fecharDetalhes()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="detalhes-conteudo"></div>
        </div>
    </div>

    <!-- MODAL DO PAINEL ADMIN -->
    <div class="modal-overlay" id="modalAdmin">
        <div class="modal-content">
            <h2><i class="fa-solid fa-plus-circle"></i> Cadastrar Nova Perícia</h2>

            <div class="form-group">
                <label>Tipo de Perícia (Muda os campos abaixo):</label>
                <select id="admin-tipo" onchange="alterarCamposAdmin()">
                    <option value="Caminhao">Caminhão</option>
                    <option value="Veiculo">Veículo</option>
                    <option value="Corpo">Corpo</option>
                    <option value="FAC/ORG">FAC/ORG</option>
                </select>
            </div>

            <div id="campos-dinamicos"></div>

            <div class="form-group" style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
                <label>Link da Imagem 1 (Obrigatório):</label>
                <input type="text" id="admin-img1" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Link da Imagem 2 (Opcional):</label>
                <input type="text" id="admin-img2" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Link da Imagem 3 (Opcional):</label>
                <input type="text" id="admin-img3" placeholder="https://...">
            </div>

            <div class="modal-btns">
                <button class="btn-cancel" onclick="fecharAdmin()"><i class="fa-solid fa-xmark"></i> Cancelar</button>
                <button class="btn-save" onclick="salvarPericia()"><i class="fa-solid fa-floppy-disk"></i> Salvar no
                    Banco</button>
            </div>
        </div>
    </div>

    <!-- CONEXÃO SUPABASE -->
    <script type="module">
        const SUPABASE_URL = 'https://ygmrymdawqrfhjiwesag.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tLfuZ5pEgj_WJeER_JhNzQ_wEm6zfi_';

        const SENHA_ADMIN = "pcerj123";

        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let abaAtual = 'Caminhao';
        let periciasGlobais = [];

        const galeria = document.getElementById('galeria');
        const modalAdmin = document.getElementById('modalAdmin');
        const modalDetalhes = document.getElementById('modalDetalhes');

        const camposPorTipo = {
            'Caminhao': [
                { id: 'modelo', label: 'Modelo' }, { id: 'placa', label: 'Placa' },
                { id: 'proprietario', label: 'Proprietário' }, { id: 'passaporte', label: 'Passaporte' },
                { id: 'id_trouxe', label: 'ID de quem trouxe' }
            ],
            'Veiculo': [
                { id: 'modelo', label: 'Modelo' }, { id: 'placa', label: 'Placa' },
                { id: 'proprietario', label: 'Proprietário' }, { id: 'passaporte', label: 'Passaporte' },
                { id: 'id_denunciante', label: 'ID do denunciante' }
            ],
            'Corpo': [
                { id: 'nome', label: 'Nome' }, { id: 'passaporte', label: 'Passaporte' }
            ],
            'FAC/ORG': [
                { id: 'org', label: 'FAC/ORG' }
            ]
        };

        window.alterarCamposAdmin = function () {
            const tipo = document.getElementById('admin-tipo').value;
            const container = document.getElementById('campos-dinamicos');
            container.innerHTML = '';
            const campos = camposPorTipo[tipo];

            let html = '<div class="form-row">';
            campos.forEach((campo, index) => {
                html += `
                    <div class="form-group">
                        <label>${campo.label}:</label>
                        <input type="text" id="dado-${campo.id}" placeholder="Digite ${campo.label}">
                    </div>
                `;
                if ((index + 1) % 2 === 0 && index !== campos.length - 1) {
                    html += '</div><div class="form-row">';
                }
            });
            html += '</div>';
            container.innerHTML = html;
        };

        alterarCamposAdmin();

        async function carregarPericias() {
            const { data, error } = await supabase.from('pericias').select('*').order('id', { ascending: false });
            if (error) {
                console.error('Erro:', error);
                galeria.innerHTML = `<div class="vazio"><i class="fa-solid fa-triangle-exclamation"></i> Erro ao carregar as perícias.</div>`;
                return;
            }
            periciasGlobais = data || [];
            renderizarGaleria();
        }

        function renderizarGaleria() {
            galeria.innerHTML = '';
            const periciasFiltradas = periciasGlobais.filter(p => p.tipo === abaAtual);

            if (periciasFiltradas.length === 0) {
                galeria.innerHTML = `<div class="vazio"><i class="fa-solid fa-folder-open"></i> Nenhuma perícia pendente nesta categoria.</div>`;
                return;
            }

            periciasFiltradas.forEach(p => {
                const card = document.createElement('div');
                card.className = `card ${p.periciado ? 'periciado' : ''}`;
                card.id = `card-${p.id}`;

                const imagemPrincipal = p.imagens && p.imagens.length > 0 ? p.imagens[0] : 'https://via.placeholder.com/300x200?text=Sem+Foto';
                const qtdImagens = p.imagens ? p.imagens.length : 0;

                // Tag avisando que tem mais fotos
                const tagMaisFotos = qtdImagens > 1
                    ? `<span class="tag-mais-fotos"><i class="fa-solid fa-images"></i> +${qtdImagens - 1} foto(s)</span>`
                    : '';

                let dadosHtml = '<div class="dados-grid">';
                if (p.dados) {
                    for (const [key, value] of Object.entries(p.dados)) {
                        if (value) dadosHtml += `<span><i class="fa-solid fa-caret-right" style="color: var(--primary);"></i> <b>${key}:</b> ${value}</span>`;
                    }
                }
                dadosHtml += '</div>';

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${imagemPrincipal}" alt="Foto" onclick="abrirDetalhes(${p.id})">
                        <span class="tag-tipo">${p.tipo}</span>
                        ${tagMaisFotos}
                        <button class="btn-delete-card" onclick="deletarPericia(${p.id})" title="Apagar Perícia">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                    <div class="card-info">
                        <h3>${p.identificador || 'Sem Identificador'}</h3>
                        ${dadosHtml}
                        
                        <div class="btn-group">
                            <button class="action-btn btn-ver" onclick="abrirDetalhes(${p.id})">
                                <i class="fa-solid fa-eye"></i> Ver Tudo
                            </button>
                            <button class="action-btn btn-periciar" onclick="marcarPericiado(${p.id})">
                                <i class="fa-solid fa-check-double"></i> Concluir
                            </button>
                        </div>

                        <div class="status-badge">
                            <i class="fa-solid fa-lock"></i> Periciado por: ${p.periciado_por || 'Desconhecido'}
                        </div>
                    </div>
                `;
                galeria.appendChild(card);
            });
        }

        // --- NOVA FUNÇÃO: ABRIR DETALHES ---
        window.abrirDetalhes = function (id) {
            const p = periciasGlobais.find(item => item.id === id);
            if (!p) return;

            const container = document.getElementById('detalhes-conteudo');

            // Monta os dados textuais
            let infoHtml = `<div class="detalhes-info">`;
            infoHtml += `<p><i class="fa-solid fa-tag"></i> <b>Tipo:</b> ${p.tipo}</p>`;
            infoHtml += `<p><i class="fa-solid fa-fingerprint"></i> <b>Identificador:</b> ${p.identificador}</p>`;
            if (p.dados) {
                for (const [key, value] of Object.entries(p.dados)) {
                    if (value) infoHtml += `<p><i class="fa-solid fa-circle-info"></i> <b>${key}:</b> ${value}</p>`;
                }
            }
            infoHtml += `</div>`;

            // Monta as imagens
            let imagensHtml = `<div class="galeria-detalhes">`;
            if (p.imagens && p.imagens.length > 0) {
                p.imagens.forEach((url, index) => {
                    imagensHtml += `
                        <div class="img-detalhe-wrapper">
                            <img src="${url}" alt="Foto ${index + 1}">
                            <button class="btn-copiar-img" onclick="copiarLink('${url}')">
                                <i class="fa-solid fa-link"></i> Copiar Link da Imagem ${index + 1}
                            </button>
                        </div>
                    `;
                });
            } else {
                imagensHtml += `<p>Sem imagens cadastradas.</p>`;
            }
            imagensHtml += `</div>`;

            container.innerHTML = infoHtml + imagensHtml;
            modalDetalhes.style.display = 'flex';
        };

        window.fecharDetalhes = function () {
            modalDetalhes.style.display = 'none';
        };

        window.mudarAba = function (tipo, botao) {
            abaAtual = tipo;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            botao.classList.add('active');
            renderizarGaleria();
        };

        window.copiarLink = function (url) {
            navigator.clipboard.writeText(url).then(() => alert("Link copiado!")).catch(() => alert("Erro ao copiar."));
        };

        window.marcarPericiado = async function (id) {
            const qra = prompt("Digite seu QRA (Nome e ID):");
            if (!qra || qra.trim() === "") return;

            const { error } = await supabase.from('pericias').update({ periciado: true, periciado_por: qra }).eq('id', id);
            if (error) alert("Erro ao salvar no banco.");
            else carregarPericias();
        };

        window.deletarPericia = async function (id) {
            const senhaDigitada = prompt("Digite a SENHA DE ADMINISTRADOR para apagar esta perícia:");
            if (senhaDigitada !== SENHA_ADMIN) {
                alert("Senha incorreta! Você não tem permissão para apagar.");
                return;
            }

            const confirmacao = confirm("Senha correta! Tem certeza que deseja APAGAR esta perícia permanentemente?");
            if (!confirmacao) return;

            const { error } = await supabase.from('pericias').delete().eq('id', id);
            if (error) {
                alert("Erro ao apagar no banco de dados.");
            } else {
                fecharDetalhes();
                carregarPericias();
            }
        };

        window.abrirAdmin = function () { modalAdmin.style.display = 'flex'; };
        window.fecharAdmin = function () { modalAdmin.style.display = 'none'; };

        window.salvarPericia = async function () {
            const tipo = document.getElementById('admin-tipo').value;
            const img1 = document.getElementById('admin-img1').value;
            const img2 = document.getElementById('admin-img2').value;
            const img3 = document.getElementById('admin-img3').value;
            const imagens = [img1, img2, img3].filter(url => url.trim() !== '');

            if (imagens.length === 0) return alert("A imagem 1 é obrigatória!");

            const campos = camposPorTipo[tipo];
            let dados = {};
            let identificador = "Sem ID";

            campos.forEach(campo => {
                const valor = document.getElementById(`dado-${campo.id}`).value;
                if (valor) {
                    dados[campo.label] = valor;
                    if (identificador === "Sem ID" || campo.id === 'nome' || campo.id === 'placa' || campo.id === 'modelo') {
                        identificador = valor;
                    }
                }
            });

            const { error } = await supabase.from('pericias').insert([{
                tipo: tipo, identificador: identificador, dados: dados, imagens: imagens
            }]);

            if (error) {
                alert("Erro ao salvar no banco.");
            } else {
                alert("Perícia cadastrada!");
                fecharAdmin();
                document.querySelectorAll('.modal-content input').forEach(input => input.value = '');
                carregarPericias();
            }
        };

        supabase.channel('pericias-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'pericias' }, payload => {
            carregarPericias();
        }).subscribe();

        carregarPericias();
    </script>
</body>

</html>
