<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perícias Free - PCERJ</title>
    <style>
        :root {
            --primary: #c9a227;
            --bg: #0f1115;
            --card-bg: #1c1f26;
            --text: #e0e0e0;
            --text-muted: #8b8f96;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* CABEÇALHO */
        header {
            background-color: #16181d;
            border-bottom: 2px solid var(--primary);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area img {
            height: 60px;
            border-radius: 50%;
        }

        .logo-area h1 {
            color: var(--primary);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-area span {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            text-transform: none;
            letter-spacing: 1px;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .admin-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ABAS (TABS) */
        .tabs {
            display: flex;
            background-color: #16181d;
            padding: 0 20px;
            overflow-x: auto;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 15px 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            background-color: rgba(201, 162, 39, 0.05);
        }

        /* CONTAINER PRINCIPAL */
        main {
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* GALERIA DE CARDS */
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2a2e38;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            /* Necessário para posicionar o botão de apagar */
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border-color: #3a3f4b;
        }

        .card-img-container {
            position: relative;
            height: 200px;
            overflow: hidden;
            background-color: #000;
            display: flex;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: zoom-in;
            transition: 0.3s;
        }

        .card-img-container img:hover {
            transform: scale(1.05);
        }

        /* Tag e Info */
        .tag-tipo {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid var(--primary);
            z-index: 2;
        }

        /* BOTÃO DE APAGAR (Canto superior direito da foto) */
        .btn-delete-card {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 3;
            background-color: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .btn-delete-card:hover {
            background-color: var(--danger);
            transform: scale(1.1);
        }

        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .card-info h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 5px;
        }

        .dados-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .dados-grid span b {
            color: #ccc;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #2a2e38;
        }

        button.action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn-copiar {
            background-color: #2c3e50;
            color: white;
        }

        .btn-copiar:hover {
            background-color: #34495e;
        }

        .btn-periciar {
            background-color: var(--primary);
            color: #000;
        }

        .btn-periciar:hover {
            background-color: #e0b834;
        }

        /* ESTADO DE PERÍCIA CONCLUÍDA */
        .card.periciado {
            opacity: 0.5;
            filter: grayscale(100%);
        }

        .card.periciado .btn-group {
            display: none;
        }

        .card.periciado .status-badge {
            display: block;
            text-align: center;
            background-color: rgba(231, 76, 60, 0.2);
            color: var(--danger);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-top: auto;
            border: 1px solid var(--danger);
        }

        .status-badge {
            display: none;
        }

        /* MODAL ADMIN */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            width: 95%;
            max-width: 700px;
            border: 1px solid var(--primary);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #3a3f4b;
            background-color: #16181d;
            color: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-btns button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cancel {
            background-color: #3a3f4b;
            color: white;
        }

        .btn-save {
            background-color: var(--primary);
            color: black;
        }

        .loading,
        .vazio {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 18px;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-area">
            <img src="https://i.imgur.com/C658rVx.png" alt="Logo PCERJ">
            <div>
                <h1>Perícias Free</h1>
                <span>Polícia Civil do Estado do Rio de Janeiro</span>
            </div>
        </div>
        <button class="admin-btn" onclick="abrirAdmin()">+ Cadastrar Perícia</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-tipo="Caminhao" onclick="mudarAba('Caminhao', this)">🚚 Caminhão</button>
        <button class="tab-btn" data-tipo="Veiculo" onclick="mudarAba('Veiculo', this)">🚗 Veículo</button>
        <button class="tab-btn" data-tipo="Corpo" onclick="mudarAba('Corpo', this)">🫀 Corpo</button>
        <button class="tab-btn" data-tipo="FAC/ORG" onclick="mudarAba('FAC/ORG', this)">🏴 FAC/ORG</button>
    </div>

    <main>
        <div class="galeria" id="galeria">
            <div class="loading">Carregando perícias...</div>
        </div>
    </main>

    <!-- MODAL DO PAINEL ADMIN -->
    <div class="modal-overlay" id="modalAdmin">
        <div class="modal-content">
            <h2>Cadastrar Nova Perícia</h2>

            <div class="form-group">
                <label>Tipo de Perícia (Muda os campos abaixo):</label>
                <select id="admin-tipo" onchange="alterarCamposAdmin()">
                    <option value="Caminhao">Caminhão</option>
                    <option value="Veiculo">Veículo</option>
                    <option value="Corpo">Corpo</option>
                    <option value="FAC/ORG">FAC/ORG</option>
                </select>
            </div>

            <div id="campos-dinamicos"></div>

            <div class="form-group" style="margin-top: 20px; border-top: 1px solid #333; padding-top: 15px;">
                <label>Link da Imagem 1 (Obrigatório):</label>
                <input type="text" id="admin-img1" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Link da Imagem 2 (Opcional):</label>
                <input type="text" id="admin-img2" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Link da Imagem 3 (Opcional):</label>
                <input type="text" id="admin-img3" placeholder="https://...">
            </div>

            <div class="modal-btns">
                <button class="btn-cancel" onclick="fecharAdmin()">Cancelar</button>
                <button class="btn-save" onclick="salvarPericia()">Salvar no Banco</button>
            </div>
        </div>
    </div>

    <!-- CONEXÃO SUPABASE -->
    <script type="module">
        const SUPABASE_URL = 'https://ygmrymdawqrfhjiwesag.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tLfuZ5pEgj_WJeER_JhNzQ_wEm6zfi_';

        // --- SENHA PARA APAGAR PERÍCIA ---
        // Troque "pcerj123" pela senha que você quiser
        const SENHA_ADMIN = "pcerj123";
        // ---------------------------------

        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let abaAtual = 'Caminhao';
        let periciasGlobais = [];

        const galeria = document.getElementById('galeria');
        const modalAdmin = document.getElementById('modalAdmin');

        const camposPorTipo = {
            'Caminhao': [
                { id: 'modelo', label: 'Modelo' }, { id: 'placa', label: 'Placa' },
                { id: 'proprietario', label: 'Proprietário' }, { id: 'passaporte', label: 'Passaporte' },
                { id: 'id_trouxe', label: 'ID de quem trouxe' }
            ],
            'Veiculo': [
                { id: 'modelo', label: 'Modelo' }, { id: 'placa', label: 'Placa' },
                { id: 'proprietario', label: 'Proprietário' }, { id: 'passaporte', label: 'Passaporte' },
                { id: 'id_denunciante', label: 'ID do denunciante' }
            ],
            'Corpo': [
                { id: 'nome', label: 'Nome' }, { id: 'passaporte', label: 'Passaporte' }
            ],
            'FAC/ORG': [
                { id: 'org', label: 'FAC/ORG' }
            ]
        };

        window.alterarCamposAdmin = function () {
            const tipo = document.getElementById('admin-tipo').value;
            const container = document.getElementById('campos-dinamicos');
            container.innerHTML = '';
            const campos = camposPorTipo[tipo];

            let html = '<div class="form-row">';
            campos.forEach((campo, index) => {
                html += `
                    <div class="form-group">
                        <label>${campo.label}:</label>
                        <input type="text" id="dado-${campo.id}" placeholder="Digite ${campo.label}">
                    </div>
                `;
                if ((index + 1) % 2 === 0 && index !== campos.length - 1) {
                    html += '</div><div class="form-row">';
                }
            });
            html += '</div>';
            container.innerHTML = html;
        };

        alterarCamposAdmin();

        async function carregarPericias() {
            const { data, error } = await supabase.from('pericias').select('*').order('id', { ascending: false });
            if (error) {
                console.error('Erro:', error);
                galeria.innerHTML = `<div class="vazio">Erro ao carregar as perícias.</div>`;
                return;
            }
            periciasGlobais = data || [];
            renderizarGaleria();
        }

        function renderizarGaleria() {
            galeria.innerHTML = '';
            const periciasFiltradas = periciasGlobais.filter(p => p.tipo === abaAtual);

            if (periciasFiltradas.length === 0) {
                galeria.innerHTML = `<div class="vazio">Nenhuma perícia pendente nesta categoria.</div>`;
                return;
            }

            periciasFiltradas.forEach(p => {
                const card = document.createElement('div');
                card.className = `card ${p.periciado ? 'periciado' : ''}`;
                card.id = `card-${p.id}`;

                const imagemPrincipal = p.imagens && p.imagens.length > 0 ? p.imagens[0] : 'https://via.placeholder.com/300x200?text=Sem+Foto';

                let dadosHtml = '<div class="dados-grid">';
                if (p.dados) {
                    for (const [key, value] of Object.entries(p.dados)) {
                        if (value) dadosHtml += `<span><b>${key}:</b> ${value}</span>`;
                    }
                }
                dadosHtml += '</div>';

                // O BOTÃO DE DELETAR AGORA APARECE PARA TODOS, MAS PEDE SENHA AO CLICAR
                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${imagemPrincipal}" alt="Foto" onclick="window.open('${imagemPrincipal}', '_blank')">
                        <span class="tag-tipo">${p.tipo}</span>
                        <button class="btn-delete-card" onclick="deletarPericia(${p.id})" title="Apagar Perícia">🗑️</button>
                    </div>
                    <div class="card-info">
                        <h3>${p.identificador || 'Sem Identificador'}</h3>
                        ${dadosHtml}
                        
                        <div class="btn-group">
                            <button class="action-btn btn-copiar" onclick="copiarLink('${imagemPrincipal}')">🔗 Copiar Foto</button>
                            <button class="action-btn btn-periciar" onclick="marcarPericiado(${p.id})">✅ Concluir</button>
                        </div>

                        <div class="status-badge">Periciado por: ${p.periciado_por || 'Desconhecido'}</div>
                    </div>
                `;
                galeria.appendChild(card);
            });
        }

        window.mudarAba = function (tipo, botao) {
            abaAtual = tipo;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            botao.classList.add('active');
            renderizarGaleria();
        };

        window.copiarLink = function (url) {
            navigator.clipboard.writeText(url).then(() => alert("Link copiado!")).catch(() => alert("Erro ao copiar."));
        };

        window.marcarPericiado = async function (id) {
            const qra = prompt("Digite seu QRA (Nome e ID):");
            if (!qra || qra.trim() === "") return;

            const { error } = await supabase.from('pericias').update({ periciado: true, periciado_por: qra }).eq('id', id);
            if (error) alert("Erro ao salvar no banco.");
            else carregarPericias();
        };

        // --- NOVA FUNÇÃO: DELETAR PERÍCIA COM SENHA ---
        window.deletarPericia = async function (id) {
            // 1. Pede a senha
            const senhaDigitada = prompt("🔒 Digite a SENHA DE ADMINISTRADOR para apagar esta perícia:");

            // 2. Verifica se a senha está correta
            if (senhaDigitada !== SENHA_ADMIN) {
                alert("Senha incorreta! Você não tem permissão para apagar.");
                return;
            }

            // 3. Confirmação final
            const confirmacao = confirm("Senha correta! Tem certeza que deseja APAGAR esta perícia permanentemente?");
            if (!confirmacao) return;

            // 4. Deleta do banco
            const { error } = await supabase.from('pericias').delete().eq('id', id);

            if (error) {
                alert("Erro ao apagar no banco de dados.");
                console.error(error);
            } else {
                carregarPericias();
            }
        };

        window.abrirAdmin = function () { modalAdmin.style.display = 'flex'; };
        window.fecharAdmin = function () { modalAdmin.style.display = 'none'; };

        window.salvarPericia = async function () {
            const tipo = document.getElementById('admin-tipo').value;
            const img1 = document.getElementById('admin-img1').value;
            const img2 = document.getElementById('admin-img2').value;
            const img3 = document.getElementById('admin-img3').value;
            const imagens = [img1, img2, img3].filter(url => url.trim() !== '');

            if (imagens.length === 0) return alert("A imagem 1 é obrigatória!");

            const campos = camposPorTipo[tipo];
            let dados = {};
            let identificador = "Sem ID";

            campos.forEach(campo => {
                const valor = document.getElementById(`dado-${campo.id}`).value;
                if (valor) {
                    dados[campo.label] = valor;
                    if (identificador === "Sem ID" || campo.id === 'nome' || campo.id === 'placa' || campo.id === 'modelo') {
                        identificador = valor;
                    }
                }
            });

            const { error } = await supabase.from('pericias').insert([{
                tipo: tipo, identificador: identificador, dados: dados, imagens: imagens
            }]);

            if (error) {
                alert("Erro ao salvar no banco.");
            } else {
                alert("Perícia cadastrada!");
                fecharAdmin();
                document.querySelectorAll('.modal-content input').forEach(input => input.value = '');
                carregarPericias();
            }
        };

        supabase.channel('pericias-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'pericias' }, payload => {
            carregarPericias();
        }).subscribe();

        carregarPericias();
    </script>
</body>

</html>
